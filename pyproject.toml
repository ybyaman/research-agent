[project]
name = "research-agent"
version = "0.1.0"
description = "Lokal LLM ile çalışan çok ajanlı araştırma asistanı"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
# Rol sahipleri ihtiyaç duydukça açar
search = ["tavily-python>=0.5", "ddgs>=9.0", "arxiv>=2.1"]
reader = ["trafilatura>=1.12", "pymupdf>=1.24"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm", "graph", "agents", "tools", "eval"]
py-modules = ["config"]
